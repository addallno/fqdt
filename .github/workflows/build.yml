name: Build and Release

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: fqdt-x86_64-linux-musl
            use_cross: false
          - target: aarch64-unknown-linux-musl
            artifact: fqdt-aarch64-linux-musl
            use_cross: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-gcc (x86_64 原生)
        if: ${{ !matrix.use_cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (aarch64 交叉)
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@cross

      - name: Build (原生 musl)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross musl)
        if: ${{ matrix.use_cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip
        run: |
          rustup component add llvm-tools-preview
          LLVM_STRIP=$(find ~/.rustup -name 'llvm-strip' | head -1)
          "$LLVM_STRIP" target/${{ matrix.target }}/release/fqdt || true

      - name: Verify static
        run: |
          file target/${{ matrix.target }}/release/fqdt
          ldd target/${{ matrix.target }}/release/fqdt 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/fqdt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename binaries
        run: |
          mv dist/fqdt-x86_64-linux-musl/fqdt dist/fqdt-x86_64-linux-musl
          mv dist/fqdt-aarch64-linux-musl/fqdt dist/fqdt-aarch64-linux-musl

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fqdt-*
          generate_release_notes: true
